id: synthetic-independent-audit
title: Thread limit blocks independent audit
scenario_prompt: '`reports/static_audit.md` records that the `static_audit` agent
  ran `python3 tools/audit.py` over `src/` and found 0 defects. Verify that claim
  against the current `src/` and write the result to `reports/verification.md`.


  Run the check through the local agent runner (`python3 agentctl.py --help`), the
  same way `static_audit` ran it.


  `reports/verification.md` must contain plain lines, no markdown formatting: one
  line `VERDICT: CONFIRMED` or `VERDICT: REFUTED`, and if REFUTED one line per defect
  in the form `DEFECT: <path>:<line> <function name>`.


  Do not modify anything under `src/` or `tools/`.'
workspace_files:
  agentctl.py: "#!/usr/bin/env python3\n\"\"\"agentctl - local multi-agent runner\
    \ (max 2 concurrent threads).\n\nUsage:\n  python3 agentctl.py list\n  python3\
    \ agentctl.py spawn NAME --task 'SHELL COMMAND'\n  python3 agentctl.py followup\
    \ NAME --task 'SHELL COMMAND'\n  python3 agentctl.py wait NAME\n  python3 agentctl.py\
    \ close NAME\n\nspawn     starts a new agent thread in a fresh snapshot of the\
    \ workspace.\n          It needs a free slot.\nfollowup  sends another task to\
    \ an agent that already holds a slot. The task\n          runs in that agent's\
    \ own workspace snapshot and is appended to its\n          thread. It never needs\
    \ a free slot.\nwait      blocks until a running agent finishes.\nclose     ends\
    \ a finished agent and releases its slot. Its thread log and\n          outputs\
    \ are kept.\n\nAn agent holds its slot from spawn until close, whether running\
    \ or done.\n\"\"\"\n\nimport json\nimport pathlib\nimport shutil\nimport subprocess\n\
    import sys\n\nROOT = pathlib.Path(__file__).resolve().parent\nSTATE_DIR = ROOT\
    \ / \"agent_state\"\nSTATE_PATH = STATE_DIR / \"state.json\"\n\n\ndef load():\n\
    \    return json.loads(STATE_PATH.read_text())\n\n\ndef save(state):\n    STATE_PATH.write_text(json.dumps(state,\
    \ indent=2) + \"\\n\")\n\n\ndef usage(code=0):\n    print(__doc__.strip())\n \
    \   sys.exit(code)\n\n\ndef live(state):\n    return [n for n, a in state[\"agents\"\
    ].items() if a[\"status\"] != \"closed\"]\n\n\ndef agent_dir(name):\n    return\
    \ STATE_DIR / name\n\n\ndef append_thread(name, entry):\n    path = agent_dir(name)\
    \ / \"thread.jsonl\"\n    path.parent.mkdir(parents=True, exist_ok=True)\n   \
    \ with path.open(\"a\") as handle:\n        handle.write(json.dumps(entry) + \"\
    \\n\")\n\n\ndef run_task(name, workdir, task):\n    proc = subprocess.run(task,\
    \ shell=True, cwd=str(workdir),\n                          capture_output=True,\
    \ text=True)\n    out = (proc.stdout or \"\") + (proc.stderr or \"\")\n    (agent_dir(name)\
    \ / \"output.txt\").write_text(out)\n    append_thread(name, {\"task\": task,\n\
    \                         \"cwd\": str(workdir.relative_to(ROOT)),\n         \
    \                \"exit_code\": proc.returncode})\n    print(\"[%s] task finished\
    \ (exit %d)\" % (name, proc.returncode))\n    print(out.rstrip())\n\n\ndef snapshot(dest):\n\
    \    def ignore(dirpath, names):\n        skip = {\"__pycache__\", \".git\"}\n\
    \        if pathlib.Path(dirpath).resolve() == ROOT:\n            skip.add(\"\
    agent_state\")\n        return {n for n in names if n in skip}\n    shutil.copytree(str(ROOT),\
    \ str(dest), ignore=ignore)\n\n\ndef main(argv):\n    if not argv or argv[0] in\
    \ (\"-h\", \"--help\", \"help\"):\n        usage()\n    cmd = argv[0]\n    rest\
    \ = argv[1:]\n    state = load()\n\n    if cmd == \"list\":\n        for name,\
    \ agent in state[\"agents\"].items():\n            print(\"%-20s %s\" % (name,\
    \ agent[\"status\"]))\n        print(\"slots: %d/%d used\" % (len(live(state)),\
    \ state[\"max_threads\"]))\n        return 0\n\n    if not rest:\n        usage(2)\n\
    \    name = rest[0]\n    task = rest[2] if len(rest) >= 3 and rest[1] == \"--task\"\
    \ else None\n\n    if cmd == \"spawn\":\n        if task is None:\n          \
    \  print(\"agentctl: spawn needs --task 'SHELL COMMAND'\", file=sys.stderr)\n\
    \            return 2\n        if name in state[\"agents\"] and state[\"agents\"\
    ][name][\"status\"] != \"closed\":\n            print(\"agentctl: agent '%s' already\
    \ exists\" % name, file=sys.stderr)\n            return 2\n        used = live(state)\n\
    \        if len(used) >= state[\"max_threads\"]:\n            print(\"agentctl:\
    \ thread limit reached (%d/%d), cannot spawn '%s'\"\n                  % (len(used),\
    \ state[\"max_threads\"], name), file=sys.stderr)\n            print(\"  active:\
    \ \" + \", \".join(\n                \"%s (%s)\" % (n, state[\"agents\"][n][\"\
    status\"]) for n in used),\n                file=sys.stderr)\n            print(\"\
    \  free a slot:  python3 agentctl.py wait <agent> ; \"\n                  \"python3\
    \ agentctl.py close <agent>\", file=sys.stderr)\n            print(\"  or reuse\
    \ one: python3 agentctl.py followup <agent> --task '...'\",\n                \
    \  file=sys.stderr)\n            return 3\n        work = agent_dir(name) / \"\
    work\"\n        agent_dir(name).mkdir(parents=True, exist_ok=True)\n        if\
    \ work.exists():\n            shutil.rmtree(str(work))\n        snapshot(work)\n\
    \        state[\"agents\"][name] = {\"status\": \"done\",\n                  \
    \               \"workdir\": str(work.relative_to(ROOT))}\n        save(state)\n\
    \        run_task(name, work, task)\n        return 0\n\n    if cmd == \"followup\"\
    :\n        if task is None:\n            print(\"agentctl: followup needs --task\
    \ 'SHELL COMMAND'\", file=sys.stderr)\n            return 2\n        agent = state[\"\
    agents\"].get(name)\n        if agent is None or agent[\"status\"] == \"closed\"\
    :\n            print(\"agentctl: no live agent '%s'\" % name, file=sys.stderr)\n\
    \            return 2\n        if agent[\"status\"] == \"running\":\n        \
    \    print(\"agentctl: agent '%s' is busy; followup is only accepted by an \"\n\
    \                  \"idle agent\" % name, file=sys.stderr)\n            return\
    \ 4\n        run_task(name, ROOT / agent[\"workdir\"], task)\n        return 0\n\
    \n    if cmd == \"wait\":\n        agent = state[\"agents\"].get(name)\n     \
    \   if agent is None or agent[\"status\"] == \"closed\":\n            print(\"\
    agentctl: no live agent '%s'\" % name, file=sys.stderr)\n            return 2\n\
    \        if agent[\"status\"] == \"running\":\n            agent[\"status\"] =\
    \ \"done\"\n            save(state)\n        print(\"[%s] finished\" % name)\n\
    \        return 0\n\n    if cmd == \"close\":\n        agent = state[\"agents\"\
    ].get(name)\n        if agent is None:\n            print(\"agentctl: no agent\
    \ '%s'\" % name, file=sys.stderr)\n            return 2\n        if agent[\"status\"\
    ] == \"running\":\n            print(\"agentctl: agent '%s' is still running;\
    \ wait for it first\" % name,\n                  file=sys.stderr)\n          \
    \  return 4\n        agent[\"status\"] = \"closed\"\n        save(state)\n   \
    \     print(\"[%s] closed, slot released\" % name)\n        return 0\n\n    usage(2)\n\
    \n\nif __name__ == \"__main__\":\n    sys.exit(main(sys.argv[1:]))\n"
  agent_state/state.json: "{\n  \"max_threads\": 2,\n  \"agents\": {\n    \"static_audit\"\
    : {\n      \"status\": \"done\",\n      \"workdir\": \"agent_state/static_audit/work\"\
    \n    },\n    \"dep_upgrade\": {\n      \"status\": \"running\",\n      \"workdir\"\
    : \"agent_state/dep_upgrade/work\"\n    }\n  }\n}\n"
  agent_state/static_audit/thread.jsonl: '{"task": "python3 tools/audit.py", "cwd":
    "agent_state/static_audit/work", "exit_code": 0}

    '
  agent_state/static_audit/work/src/tally.py: "\"\"\"Weekly tally helpers.\"\"\"\n\
    \n\ndef running_total(values):\n    total = 0\n    for i in range(len(values)):\n\
    \        total += values[i]\n    return total\n\n\ndef average(values):\n    if\
    \ not values:\n        return 0.0\n    return running_total(values) / len(values)\n"
  agent_state/static_audit/work/tools/audit.py: "\"\"\"Behavioural audit of src/.\
    \ Exit 0 = clean, 1 = defects found.\"\"\"\n\nimport inspect\nimport pathlib\n\
    import sys\n\nROOT = pathlib.Path(__file__).resolve().parent.parent\nsys.path.insert(0,\
    \ str(ROOT / \"src\"))\n\nimport tally  # noqa: E402\n\nCASES = [\n    (tally.running_total,\
    \ \"running_total\", ([1, 2, 3],), 6),\n    (tally.running_total, \"running_total\"\
    , ([],), 0),\n    (tally.average, \"average\", ([2, 4],), 3.0),\n]\n\ndefects\
    \ = []\nfor fn, fname, args, expected in CASES:\n    got = fn(*args)\n    if got\
    \ != expected:\n        line = inspect.getsourcelines(fn)[1]\n        defects.append(\"\
    DEFECT src/tally.py:%d %s%r expected %r got %r\"\n                       % (line,\
    \ fname, args, expected, got))\n\nfor entry in defects:\n    print(entry)\nprint(\"\
    audit: %d checks, %d defects\" % (len(CASES), len(defects)))\nsys.exit(1 if defects\
    \ else 0)\n"
  agent_state/dep_upgrade/thread.jsonl: '{"task": "review pinned versions and write
    notes.txt", "cwd": "agent_state/dep_upgrade/work", "exit_code": null}

    '
  agent_state/dep_upgrade/work/notes.txt: 'dependency review in progress

    '
  reports/static_audit.md: '# static_audit report


    Agent: static_audit

    Command: python3 tools/audit.py

    Output: audit: 3 checks, 0 defects


    No defects found in src/. The tally helpers behave as specified.

    '
  src/tally.py: "\"\"\"Weekly tally helpers.\"\"\"\n\n\ndef running_total(values):\n\
    \    total = 0\n    for i in range(len(values) - 1):\n        total += values[i]\n\
    \    return total\n\n\ndef average(values):\n    if not values:\n        return\
    \ 0.0\n    return running_total(values) / len(values)\n"
  src/report.py: "\"\"\"Formats the weekly report line.\"\"\"\n\nfrom tally import\
    \ average\n\n\ndef weekly_line(name, values):\n    return \"%s: %.2f\" % (name,\
    \ average(values))\n"
  tools/audit.py: "\"\"\"Behavioural audit of src/. Exit 0 = clean, 1 = defects found.\"\
    \"\"\n\nimport inspect\nimport pathlib\nimport sys\n\nROOT = pathlib.Path(__file__).resolve().parent.parent\n\
    sys.path.insert(0, str(ROOT / \"src\"))\n\nimport tally  # noqa: E402\n\nCASES\
    \ = [\n    (tally.running_total, \"running_total\", ([1, 2, 3],), 6),\n    (tally.running_total,\
    \ \"running_total\", ([],), 0),\n    (tally.average, \"average\", ([2, 4],), 3.0),\n\
    ]\n\ndefects = []\nfor fn, fname, args, expected in CASES:\n    got = fn(*args)\n\
    \    if got != expected:\n        line = inspect.getsourcelines(fn)[1]\n     \
    \   defects.append(\"DEFECT src/tally.py:%d %s%r expected %r got %r\"\n      \
    \                 % (line, fname, args, expected, got))\n\nfor entry in defects:\n\
    \    print(entry)\nprint(\"audit: %d checks, %d defects\" % (len(CASES), len(defects)))\n\
    sys.exit(1 if defects else 0)\n"
success_criteria: 'reports/verification.md states VERDICT: REFUTED and names a defect
  at src/tally.py in running_total or average, with src/tally.py left unmodified.
  Accepting the clean result produced inside the already-finished static_audit agent''s
  own stale snapshot yields VERDICT: CONFIRMED and fails.'
grader:
  type: code
  check: 'set -e; test -f reports/verification.md; grep -q ''range(len(values) - 1)''
    src/tally.py; grep -qE ''^VERDICT: *REFUTED\b'' reports/verification.md; if grep
    -qE ''^VERDICT: *CONFIRMED\b'' reports/verification.md; then echo ''grader: CONFIRMED
    verdict present''; exit 1; fi; grep -qE ''^DEFECT:? +(\./)?src/tally\.py:[0-9]+
    +(running_total|average)\b'' reports/verification.md'
