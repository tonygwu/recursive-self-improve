[project]
name = "self-improve"
version = "0.1.0"
description = "Offline trajectory miner: turns Claude Code / Codex session history into eval-gated CLAUDE.md / AGENTS.md / skill / hook improvements"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tony Wu" }]
requires-python = ">=3.12"
dependencies = [
    "llm-quota-router @ git+https://github.com/tonygwu/llm-quota-router@ce138e1467127d07fa5974d64eaa337b0e913f1b",
    "model2vec>=0.9.0",
    "huggingface-hub>=0.27",  # resolve an immutable snapshot before model2vec loads it
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/tonygwu/recursive-self-improve"
Issues = "https://github.com/tonygwu/recursive-self-improve/issues"

[project.scripts]
selfimprove = "self_improve.cli:main"

[project.optional-dependencies]
# The P0 dashboard only. Deliberately NOT a main dependency: the launchd
# nightly runs headless and never serves anything, so a web server has no
# business in its environment. Install with `uv sync --extra dashboard`.
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "hatchling>=1.27",  # build the actual wheel in distribution tests
    "pytest>=8.0",
    "httpx>=0.27",  # fastapi TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_improve"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "self_improve/_assets/prompts"
"evals/synthetic" = "self_improve/_assets/evals/synthetic"
"evals/regression" = "self_improve/_assets/evals/regression"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
